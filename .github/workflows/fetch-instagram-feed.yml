name: Fetch Instagram feed

on:
  schedule:
      - cron: '1,10 * * * *'   # every 0:00 and 0:10
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feed
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node fetch-feed.js

      - name: Commit updated feed.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/feed.json
          git diff --quiet --cached || git commit -m "Update Instagram feed"
          git push
